<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedalo · iOS Signup Flow</title>
<style>
  html, body { margin: 0; padding: 0; background: #EEF1F7; font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas
      title="Pedalo — iOS Signup"
      subtitle="A 6‑screen first‑run flow for a city bikeshare. Blue + orange. iOS 26."
    >
      <DCSection id="flow" title="Signup flow" subtitle="Welcome → Phone → OTP → Profile → Plan → Ready">
        <DCArtboard id="welcome" label="01 · Welcome" width={402} height={874}>
          <ScreenWelcome />
        </DCArtboard>
        <DCArtboard id="phone" label="02 · Phone" width={402} height={874}>
          <ScreenPhone />
        </DCArtboard>
        <DCArtboard id="otp" label="03 · Verify" width={402} height={874}>
          <ScreenOTP />
        </DCArtboard>
        <DCArtboard id="profile" label="04 · Profile" width={402} height={874}>
          <ScreenProfile />
        </DCArtboard>
        <DCArtboard id="plan" label="05 · Plan" width={402} height={874}>
          <ScreenPlan />
        </DCArtboard>
        <DCArtboard id="ready" label="06 · Ready to ride" width={402} height={874}>
          <ScreenReady />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
